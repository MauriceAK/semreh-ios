name: Companion picker diagnostic
run-name: Cold picker comparison from ${{ github.sha }}

on:
  push:
    branches: [companion/picker-diagnostics-20261021]

permissions:
  contents: read

concurrency:
  group: companion-picker-diagnostics
  cancel-in-progress: false

jobs:
  compare:
    runs-on: macos-26
    timeout-minutes: 90
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Run the bounded cold comparison
        run: python3 Companion/diagnostics/picker/run.py
      - name: Preserve private fixture diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: picker-diagnostic-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/PickerDiagnosticEvidence
          if-no-files-found: error
          retention-days: 7
          include-hidden-files: true
