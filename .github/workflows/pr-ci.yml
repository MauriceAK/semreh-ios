# Contributor CI: build and run the full XCTest suite on every pull request
# that touches app code. Docs-only PRs (markdown, docs/, community files) skip
# the macOS runner entirely and pass via the cheap gate job.
#
# The required branch-protection check is "CI Gate", not "Build and Test":
# a skipped required check would block merges forever, so the gate always
# runs and passes when the suite either succeeded or was legitimately skipped.
#
# Uses no repository secrets, so PRs from forks get green CI too.
#
# Code signing is disabled (CODE_SIGNING_ALLOWED=NO) — fine for compile/test
# runs per TESTFLIGHT.md; the "simulator installs must be signed" rule applies
# to manual simulator testing, not CI.

name: PR CI

on:
  pull_request:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: pr-ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run_ios: ${{ steps.filter.outputs.run_ios }}
    steps:
      - name: Classify changed files
        id: filter
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          files=$(gh api "repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/files" \
            --paginate --jq '.[].filename')
          echo "Changed files:"
          echo "${files}"
          # Fail closed: anything NOT on the docs-only allowlist triggers the
          # full suite (including workflow, project, and config changes).
          non_docs=$(echo "${files}" | grep -vE '^(docs/.*|LICENSE|\.gitignore|\.github/ISSUE_TEMPLATE/.*|\.github/CODEOWNERS|\.github/dependabot\.yml|\.github/FUNDING\.yml|Gemfile|Gemfile.lock|\.ruby-version|fastlane/.*|ci/TestFlightExport.*\.plist|.*\.md)$' || true)
          if [[ -n "${non_docs}" ]]; then
            echo "Non-docs changes detected — running the full suite:"
            echo "${non_docs}"
            echo "run_ios=true" >> "$GITHUB_OUTPUT"
          else
            echo "Docs-only change — skipping the macOS runner."
            echo "run_ios=false" >> "$GITHUB_OUTPUT"
          fi

  test:
    name: Build and Test
    needs: changes
    if: needs.changes.outputs.run_ios == 'true'
    runs-on: macos-26
    timeout-minutes: 90

    env:
      PROJECT_PATH: HermesMobile.xcodeproj
      SCHEME: HermesMobile
      DERIVED_DATA_PATH: DerivedData
      RESULT_BUNDLE_PATH: TestResults.xcresult

    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Select simulator
        id: sim
        run: |
          set -euo pipefail
          device=$(xcrun simctl list devices available --json | python3 -c '
          import json, sys
          data = json.load(sys.stdin)
          phones = [
              device
              for runtime, devices in data["devices"].items()
              if "iOS" in runtime
              for device in devices
              if device.get("isAvailable") and device["name"].startswith("iPhone")
          ]
          preferred = "iPhone 17"
          selected = next((phone for phone in phones if phone["name"] == preferred), phones[0] if phones else None)
          print(selected["udid"] + "|" + selected["name"] if selected else "")
          ')
          if [[ -z "${device}" ]]; then
            echo "No available iPhone simulator found:" >&2
            xcrun simctl list devices available >&2
            exit 1
          fi
          simulator_id=${device%%|*}
          simulator_name=${device#*|}
          echo "Using simulator: ${simulator_name} (${simulator_id})"
          echo "id=${simulator_id}" >> "$GITHUB_OUTPUT"

      - name: Build for testing
        env:
          SIMULATOR_ID: ${{ steps.sim.outputs.id }}
        run: |
          set -euo pipefail
          start_seconds=${SECONDS}
          xcodebuild build-for-testing \
            -project "${PROJECT_PATH}" \
            -scheme "${SCHEME}" \
            -destination "platform=iOS Simulator,id=${SIMULATOR_ID}" \
            -derivedDataPath "${DERIVED_DATA_PATH}" \
            -showBuildTimingSummary \
            CODE_SIGNING_ALLOWED=NO
          duration_seconds=$((SECONDS - start_seconds))
          echo "Build-for-testing duration: ${duration_seconds}s"
          echo "### PR CI timing" >> "${GITHUB_STEP_SUMMARY}"
          echo "- Build for testing: ${duration_seconds}s" >> "${GITHUB_STEP_SUMMARY}"

      - name: Test without building
        id: full-tests
        env:
          SIMULATOR_ID: ${{ steps.sim.outputs.id }}
        run: |
          set -euo pipefail
          start_seconds=${SECONDS}
          python3 ci/watch_mounted_startup.py --observe-only --simulator "${SIMULATOR_ID}" \
            --output MountedStartupDiagnostics > mounted-watchdog.log 2>&1 &
          watchdog_pid=$!
          trap 'kill -TERM "${watchdog_pid}" 2>/dev/null || true; wait "${watchdog_pid}" 2>/dev/null || true' EXIT
          # Hosted mounted-view tests share scene/window ownership. Match the
          # serial local harness rather than creating a clone with one worker.
          xcodebuild test-without-building \
            -project "${PROJECT_PATH}" \
            -scheme "${SCHEME}" \
            -destination "platform=iOS Simulator,id=${SIMULATOR_ID}" \
            -derivedDataPath "${DERIVED_DATA_PATH}" \
            -resultBundlePath "${RESULT_BUNDLE_PATH}" \
            -parallel-testing-enabled NO \
            CODE_SIGNING_ALLOWED=NO
          duration_seconds=$((SECONDS - start_seconds))
          echo "Test-without-building duration: ${duration_seconds}s"
          echo "- Test without building (serial mounted host): ${duration_seconds}s" >> "${GITHUB_STEP_SUMMARY}"

      - name: Export safe mounted-readiness state
        if: always()
        continue-on-error: true
        run: |
          python3 ci/export_mounted_readiness.py --result "${RESULT_BUNDLE_PATH}" \
            --output MountedStartupDiagnostics

      - name: Select failed-startup diagnostics
        id: startup-diagnostic
        if: ${{ failure() && steps.full-tests.outcome == 'failure' }}
        continue-on-error: true
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          path = Path("MountedStartupDiagnostics/safe/readiness.json")
          report = json.loads(path.read_text()) if path.is_file() else {}
          needed = any(item.get("receipt", {}).get("phase") == "startup: initial prompt running"
                       for item in report.get("diagnostics", []))
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write("needed=" + str(needed).lower() + "\n")
          PY

      - name: Create separate startup diagnostic simulator
        id: diagnostic-sim
        if: ${{ failure() && steps.startup-diagnostic.outputs.needed == 'true' }}
        continue-on-error: true
        timeout-minutes: 4
        env:
          SOURCE_SIMULATOR_ID: ${{ steps.sim.outputs.id }}
        run: |
          python3 ci/diagnostic_simulator.py create --source "${SOURCE_SIMULATOR_ID}" \
            --ownership MountedDiagnosticSimulator/ownership.json

      - name: Profile failed startup separately
        if: ${{ failure() && steps.diagnostic-sim.outputs.id != '' }}
        continue-on-error: true
        timeout-minutes: 10
        env:
          SIMULATOR_ID: ${{ steps.diagnostic-sim.outputs.id }}
        run: |
          set -euo pipefail
          python3 ci/watch_mounted_startup.py --max-samples 1 --sample-timeout 10 --simulator "${SIMULATOR_ID}" \
            --built-app "${PWD}/${DERIVED_DATA_PATH}/Build/Products/Debug-iphonesimulator/HermesMobile.app" \
            --scheme "${SCHEME}" --ownership MountedDiagnosticSimulator/ownership.json \
            --output MountedFocusedDiagnostics > mounted-focused-watchdog.log 2>&1 &
          watchdog_pid=$!
          trap 'kill -TERM "${watchdog_pid}" 2>/dev/null || true; wait "${watchdog_pid}" 2>/dev/null || true' EXIT
          # Perturbed diagnostic only: cannot override the full-suite outcome.
          # The watcher binds the actual XCTest host; no manual app launch.
          # At most one 2s/10ms sample; raw stacks remain private on this worker.
          xcodebuild test-without-building \
            -project "${PROJECT_PATH}" \
            -scheme "${SCHEME}" \
            -destination "platform=iOS Simulator,id=${SIMULATOR_ID}" \
            -derivedDataPath "${DERIVED_DATA_PATH}" \
            -resultBundlePath MountedFocusedResults.xcresult \
            -parallel-testing-enabled NO \
            -only-testing:HermesMobileTests/ChatTranscriptViewRestoreTests/testMountedSteerAcceptanceClearsUnchangedDraft \
            -only-testing:HermesMobileTests/ChatTranscriptViewRestoreTests/testMountedSteerBackReopenRetiresOldCompletionOwnership \
            CODE_SIGNING_ALLOWED=NO

      - name: Export focused diagnostic state
        if: ${{ always() && steps.diagnostic-sim.outputs.id != '' }}
        continue-on-error: true
        run: |
          python3 ci/export_mounted_readiness.py --result MountedFocusedResults.xcresult \
            --output MountedFocusedDiagnostics

      - name: Clean up separate diagnostic simulator
        if: ${{ always() && steps.diagnostic-sim.outputs.id != '' }}
        continue-on-error: true
        run: |
          python3 ci/diagnostic_simulator.py cleanup --ownership MountedDiagnosticSimulator/ownership.json

      - name: Retain safe focused diagnostics
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: mounted-focused-safe
          path: MountedFocusedDiagnostics/safe
          retention-days: 1
          if-no-files-found: ignore

      - name: Retain safe mounted-startup diagnostics
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: mounted-startup-safe
          path: MountedStartupDiagnostics/safe
          retention-days: 1
          if-no-files-found: ignore

      - name: Report slowest tests
        if: always()
        continue-on-error: true
        run: |
          set -euo pipefail
          if [[ ! -d "${RESULT_BUNDLE_PATH}" ]]; then
            echo "No result bundle is available; skipping slow-test reporting."
            exit 0
          fi

          xcrun xcresulttool get test-results tests \
            --path "${RESULT_BUNDLE_PATH}" \
            --compact > test-results.json

          python3 - <<'PY' | tee slowest-tests.txt
          import json

          with open("test-results.json", encoding="utf-8") as results_file:
              results = json.load(results_file)

          tests = []

          def visit(node, parents):
              name = node.get("name", "<unnamed>")
              node_type = node.get("nodeType")
              path = [*parents, name]
              duration = node.get("durationInSeconds")
              if node_type == "Test Case" and isinstance(duration, (int, float)):
                  tests.append((duration, " / ".join(path)))
              for child in node.get("children", []):
                  visit(child, path)

          for root in results.get("testNodes", []):
              visit(root, [])

          print("Slowest test cases:")
          for duration, name in sorted(tests, reverse=True)[:20]:
              print(f"{duration:8.3f}s  {name}")
          PY

          {
            echo ""
            echo "#### Slowest test cases"
            echo '```text'
            cat slowest-tests.txt
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload test results on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: ${{ env.RESULT_BUNDLE_PATH }}
          if-no-files-found: ignore

  gate:
    name: CI Gate
    needs: [changes, test]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check results
        run: |
          set -euo pipefail
          echo "changes: ${{ needs.changes.result }}"
          echo "test: ${{ needs.test.result }}"
          if [[ "${{ needs.changes.result }}" != "success" ]]; then
            echo "Path detection failed — failing the gate." >&2
            exit 1
          fi
          case "${{ needs.test.result }}" in
            success|skipped) echo "Gate passed." ;;
            *) echo "Build and Test did not pass — failing the gate." >&2; exit 1 ;;
          esac
