# Maintainer-only: uploads a build to the production app's internal TestFlight
# via Fastlane on every merge to master. Requires APP_STORE_CONNECT_* secrets
# on the `internal-testflight` environment. Contributor CI lives in pr-ci.yml.

name: Internal TestFlight

on:
  push:
    branches: [master]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "LICENSE"
  workflow_dispatch:
    inputs:
      build_number:
        description: "Optional CFBundleVersion override. Leave blank to use the next App Store Connect build number."
        required: false
        type: string

run-name: "Internal TestFlight from ${{ github.ref_name }}"

permissions:
  contents: read

concurrency:
  group: internal-testflight
  cancel-in-progress: false

jobs:
  upload:
    name: Fastlane TestFlight
    runs-on: macos-26
    environment: internal-testflight
    timeout-minutes: 75

    env:
      APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
      APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
      APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
      EXPORT_OPTIONS_PLIST: ci/TestFlightExportIPA.plist
      PROJECT_PATH: HermesMobile.xcodeproj
      SCHEME: HermesMobile
      TEAM_ID: XXXXXXXXXX
      BUNDLE_ID: com.mauriceak.semreh
      FASTLANE_SKIP_UPDATE_CHECK: "1"
      FASTLANE_HIDE_CHANGELOG: "1"

    steps:
      - name: Check branch gate
        run: |
          set -euo pipefail

          if [[ "${GITHUB_REF_NAME}" != "master" ]]; then
            echo "Internal TestFlight uploads must run from master. Current ref: ${GITHUB_REF_NAME}" >&2
            exit 1
          fi

      - name: Check required secrets
        run: |
          set -euo pipefail

          missing=0
          for name in APP_STORE_CONNECT_KEY_ID APP_STORE_CONNECT_ISSUER_ID APP_STORE_CONNECT_PRIVATE_KEY; do
            if [[ -z "${!name}" ]]; then
              echo "Missing required secret: ${name}" >&2
              echo "Add it to the internal-testflight GitHub environment, then re-run." >&2
              missing=1
            fi
          done

          exit "${missing}"

      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set output paths
        run: |
          set -euo pipefail

          {
            echo "DERIVED_DATA_PATH=${RUNNER_TEMP}/DerivedData"
            echo "EXPORT_PATH=${RUNNER_TEMP}/TestFlightExport"
          } >> "${GITHUB_ENV}"

      - name: Detect marketing version
        run: |
          set -euo pipefail

          marketing_version="$(
            xcodebuild \
              -showBuildSettings \
              -project "${PROJECT_PATH}" \
              -scheme "${SCHEME}" \
              -configuration Release 2>/dev/null |
              awk -F'= ' '/MARKETING_VERSION/ { print $2; exit }'
          )"

          if [[ -z "${marketing_version}" ]]; then
            echo "Could not detect MARKETING_VERSION from Xcode build settings." >&2
            exit 1
          fi

          echo "MARKETING_VERSION=${marketing_version}" >> "${GITHUB_ENV}"
          echo "Using marketing version ${marketing_version}"

      - name: Write App Store Connect key
        run: |
          set -euo pipefail

          key_path="${RUNNER_TEMP}/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8"
          if [[ "${APP_STORE_CONNECT_PRIVATE_KEY}" == *"\\n"* ]]; then
            printf "%s" "${APP_STORE_CONNECT_PRIVATE_KEY}" | perl -pe 's/\\n/\n/g' > "${key_path}"
          else
            printf "%s" "${APP_STORE_CONNECT_PRIVATE_KEY}" > "${key_path}"
          fi
          chmod 600 "${key_path}"
          echo "APP_STORE_CONNECT_KEY_PATH=${key_path}" >> "${GITHUB_ENV}"

      - name: Set requested build number
        env:
          REQUESTED_BUILD_NUMBER: ${{ github.event_name == 'workflow_dispatch' && inputs.build_number || '' }}
        run: |
          set -euo pipefail
          echo "REQUESTED_BUILD_NUMBER=${REQUESTED_BUILD_NUMBER}" >> "${GITHUB_ENV}"

      - name: Show upload target
        run: |
          set -euo pipefail

          echo "Uploading internal-only TestFlight build with Fastlane"
          echo "Commit SHA: ${GITHUB_SHA}"
          echo "Marketing version: ${MARKETING_VERSION}"
          echo "Requested build number: ${REQUESTED_BUILD_NUMBER:-<auto>}"
          echo "Export options: ${EXPORT_OPTIONS_PLIST}"

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3.8"
          bundler-cache: true

      - name: Resolve Swift packages
        run: |
          set -euo pipefail

          xcodebuild \
            -resolvePackageDependencies \
            -project "${PROJECT_PATH}" \
            -scheme "${SCHEME}"

      - name: Fastlane internal TestFlight
        run: bundle exec fastlane ios internal_testflight
